# D5's per-OS builds (§7.6): the Linux .AppImage and .deb, and one Apple silicon macOS
# .dmg (Macs are Apple silicon only, Michael's ruling), from the pins in
# desktop/pins.toml; and from the same build the browser version's tarball (TASK-48
# §3.6). Dispatched by hand, it builds and checks the packages and keeps them as the
# run's artifacts; on a v<app.version> tag, it first requires cross-repo.yml green on the
# tagged commit, and last attaches the packages to the tag's release, public downloads
# like the repository, with the browser command in its notes, then runs that command on
# both systems as a user would. The macOS job launches the app it built once and waits
# for the Library App's backend to be ready, then the browser command on its tarball.
# No job calls a model.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # A pin moves only when cross-repo.yml is green on the new set (spec §2): a tag ships
  # only a commit it passed on.
  cross-repo-green:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/pins.toml
          sparse-checkout-cone-mode: false
      # The browser command fetches releases/download/v<app.version>/ (TASK-48 W14).
      - name: The tag is v and desktop/pins.toml's app version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("desktop/pins.toml", "rb"))["app"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version, desktop/pins.toml's app version: tag v$version, or move the version"
            exit 1
          fi
      - name: cross-repo.yml passed on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cross-repo.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$passed" -eq 0 ]; then
            echo "::error::cross-repo.yml has no successful run on $GITHUB_SHA: dispatch it there (gh workflow run cross-repo.yml --ref <branch>) and tag again once it is green"
            exit 1
          fi

  linux:
    needs: cross-repo-green
    if: ${{ !cancelled() && needs.cross-repo-green.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Read access to deep_reasoner_beta (private)
        run: git config --global url."https://x-access-token:${{ secrets.DEEP_REASONER_TOKEN }}@github.com/DeanLight/".insteadOf "https://github.com/DeanLight/"
      - name: Build the .AppImage, the .deb and the browser tarball (build.py checks them)
        run: uv run desktop/build.py linux web
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tgz
          if-no-files-found: error

  macos:
    needs: cross-repo-green
    if: ${{ !cancelled() && needs.cross-repo-green.result != 'failure' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # deep-reasoning is public: the app's setup fetches it as anyone's would.
      - name: Read access to deep_reasoner_beta (private)
        run: git config --global url."https://x-access-token:${{ secrets.DEEP_REASONER_TOKEN }}@github.com/DeanLight/".insteadOf "https://github.com/DeanLight/"
      - name: Build the Apple silicon .dmg (build.py checks it is arm64 only) and the browser tarball
        run: uv run desktop/build.py mac-arm64 web
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The .app inside it
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          cp -R "$RUNNER_TEMP/dmg/Deep Reasoning.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - name: Launch it once; the Library App's backend starts (S2 PR 3's falsifier)
        run: uv run pytest -m desktop tests/desktop/test_launch_smoke.py -v -rA -s --basetemp "$RUNNER_TEMP/pytest"
        env:
          DR_APP_EXECUTABLE: ${{ runner.temp }}/Deep Reasoning.app/Contents/MacOS/Deep Reasoning
      # The Linux job's tarball is the release's; this one runs the command on a Mac once.
      - name: The browser command on Apple silicon, and the Python uvx picks reaching GitHub
        run: |
          DR_WEB_TARBALL="$(ls "$PWD"/dist/deep-reasoning-web-*.tgz)" \
            uv run pytest -m web tests/desktop/test_web_smoke.py -v -rA -s --basetemp "$RUNNER_TEMP/pytest-web"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-macos
          path: dist/*.dmg
          if-no-files-found: error
      # What a failed launch leaves: the app's own log, and macOS's crash reports.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-macos-launch
          path: |
            ${{ runner.temp }}/pytest/**/app.log
            ${{ runner.temp }}/pytest-web/**/web.log
            ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore

  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      # dr_web is standard library only: the command is formed with the runner's python3.
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: packages/dr-web
      - name: Attach the packages to the tag's release (public downloads, like the repository)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PYTHONPATH: source/packages/dr-web/src
        run: |
          command="$(python3 -c 'import sys; from dr_web.cli import command_for; print(command_for(sys.argv[1]))' "$GITHUB_SHA")"
          notes="Deep Reasoning $TAG. The .dmg is for macOS 14 or later on Apple silicon; the .AppImage and the .deb are for Linux on x86-64.

          Or run it in your browser instead, on the same computers, with uv 0.8.17 or later and git (the README's \"Run it in your browser\"):

              $command"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "$notes"
          gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber

  # The released command as a user runs it (TASK-48 V7): no tarball given, so it downloads
  # the release's own, on both systems the app ships for. It starts no conversation.
  release-smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Read access to deep_reasoner_beta (private)
        run: git config --global url."https://x-access-token:${{ secrets.DEEP_REASONER_TOKEN }}@github.com/DeanLight/".insteadOf "https://github.com/DeanLight/"
      - name: The release's command, downloading its tarball
        run: uv run pytest -m web tests/desktop/test_web_smoke.py -v -rA -s --basetemp "$RUNNER_TEMP/pytest-web"
        env:
          DR_WEB_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest-web/**/web.log
          if-no-files-found: ignore
