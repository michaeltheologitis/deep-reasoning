# PROBE ONLY (branch probe/macos-setup, never merged): why the macOS app's setup
# command printed nothing for 15 minutes in run 37229135885. It runs the setup
# command's first step, uvx of dr-app from this repository, as the app runs it: uv
# 0.12.23, a fresh HOME holding the runner's git config, no runner uv settings.
name: desktop-release

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Read access, as the release job sets it
        run: |
          git config --global url."https://x-access-token:${{ secrets.DEEP_REASONER_TOKEN }}@github.com/DeanLight/".insteadOf "https://github.com/DeanLight/"
          git config --global url."https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}".insteadOf "https://github.com/${{ github.repository }}"
      - name: git's configuration, with origins
        run: |
          which -a git; git --version
          git config --list --show-origin --show-scope | sed -E 's/x-access-token:[^@]*@/x-access-token:***@/'
      - name: uvx of dr-app in a fresh HOME, sampled
        run: |
          home="$(mktemp -d /tmp/probe-XXXX)/home"
          mkdir -p "$home"
          cp ~/.gitconfig "$home/"
          (
            for i in 1 2 3 4 5 6; do
              sleep 20
              echo "--- processes at $((i * 20)) s"
              ps -A -o pid,ppid,etime,command | grep -Ei "git|uv|python|credential|security|keychain" | grep -v grep | sed -E 's/x-access-token:[^@]*@/x-access-token:***@/'
            done
          ) &
          set +e
          env -u UV_CACHE_DIR -u UV_PYTHON -u VIRTUAL_ENV HOME="$home" GIT_TERMINAL_PROMPT=0 GIT_TRACE=1 \
            perl -e 'alarm shift; exec @ARGV' 110 \
            uvx -v --from "git+https://github.com/${{ github.repository }}@${{ github.sha }}#subdirectory=packages/dr-app" dr-app --help 2>&1 \
            | sed -E 's/x-access-token:[^@]*@/x-access-token:***@/'
          echo "uvx exit: ${PIPESTATUS[0]}"
          wait
