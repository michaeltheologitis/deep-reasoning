# D5's per-OS builds (§7.6): the Linux .AppImage and .deb, and one universal macOS .dmg,
# from the pins in desktop/pins.toml. Dispatched by hand, it builds and checks the
# packages and keeps them as the run's artifacts; on a v* tag, it first requires
# cross-repo.yml green on the tagged commit, and last attaches the packages to the
# tag's release. The macOS job launches the app it built once and waits for the Library
# App's backend to be ready. No job calls a model.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # main carries this file before D5's code does (decision M): on a tree without
  # desktop/pins.toml every job below is skipped, not failed.
  has-d5:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.look.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/pins.toml
          sparse-checkout-cone-mode: false
      - id: look
        run: |
          if [ -f desktop/pins.toml ]; then echo "present=true"; else echo "present=false"; fi >> "$GITHUB_OUTPUT"

  # A pin moves only when cross-repo.yml is green on the new set (spec §2): a tag ships
  # only a commit it passed on.
  cross-repo-green:
    needs: has-d5
    if: needs.has-d5.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: cross-repo.yml passed on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cross-repo.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$passed" -eq 0 ]; then
            echo "::error::cross-repo.yml has no successful run on $GITHUB_SHA: dispatch it there (gh workflow run cross-repo.yml --ref <branch>) and tag again once it is green"
            exit 1
          fi

  linux:
    needs: [has-d5, cross-repo-green]
    if: ${{ !cancelled() && needs.has-d5.outputs.present == 'true' && needs.cross-repo-green.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Read access to deep_reasoner_beta (private)
        run: git config --global url."https://x-access-token:${{ secrets.DEEP_REASONER_TOKEN }}@github.com/DeanLight/".insteadOf "https://github.com/DeanLight/"
      - name: Build the .AppImage and the .deb (build.py checks them)
        run: uv run desktop/build.py linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  macos:
    needs: [has-d5, cross-repo-green]
    if: ${{ !cancelled() && needs.has-d5.outputs.present == 'true' && needs.cross-repo-green.result != 'failure' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Read access to deep_reasoner_beta and deep-reasoning (private)
        run: |
          git config --global url."https://x-access-token:${{ secrets.DEEP_REASONER_TOKEN }}@github.com/DeanLight/".insteadOf "https://github.com/DeanLight/"
          git config --global url."https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}".insteadOf "https://github.com/${{ github.repository }}"
      - name: Build the universal .dmg (build.py checks it)
        run: uv run desktop/build.py mac-universal
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The .app inside it
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          cp -R "$RUNNER_TEMP/dmg/Deep Reasoning.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - name: Launch it once; the Library App's backend starts (S2 PR 3's falsifier)
        run: uv run pytest -m desktop tests/desktop/test_launch_smoke.py -v -rA -s --basetemp "$RUNNER_TEMP/pytest"
        env:
          DR_APP_EXECUTABLE: ${{ runner.temp }}/Deep Reasoning.app/Contents/MacOS/Deep Reasoning
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-macos
          path: dist/*.dmg
          if-no-files-found: error
      # What a failed launch leaves: the app's own log, and macOS's crash reports.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-macos-launch
          path: |
            ${{ runner.temp }}/pytest/**/app.log
            ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore

  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Attach the packages to the tag's release (private, like the repository)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "Deep Reasoning $TAG"
          gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
