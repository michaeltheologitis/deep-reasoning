# The live tier: real runs through dr-acp, started on demand: gpt-6-luna on the OpenAI
# key, and Claude Code on Sonnet on Michael's subscription token. No ANTHROPIC_API_KEY,
# ever: Claude Code would bill it per token instead of the subscription.
name: live

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: The model keys are repository secrets
        run: |
          for name in OPENAI_API_KEY CLAUDE_CODE_OAUTH_TOKEN; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::the $name repository secret is not set"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The Claude Code CLI, pinned
        run: npm install -g @anthropic-ai/claude-code@2.1.285 && claude --version
      - name: Read access to deep_reasoner_beta (private)
        run: git config --global url."https://x-access-token:${{ secrets.DEEP_REASONER_TOKEN }}@github.com/DeanLight/".insteadOf "https://github.com/DeanLight/"
      - run: uv sync --locked
      - run: uv run pytest -m live -v -rA --basetemp="$RUNNER_TEMP/live"
      # On a failure, every test's dr home is kept: its runs (run log, model calls,
      # deep_reasoner's trace, each MCP server's log, all redacted) and the MCP test's
      # transcript. They are uploaded only once no file in them holds a secret the job
      # holds: either model key, or the token that reads deep_reasoner_beta. An empty
      # value is skipped, since grep would find it in every file.
      - name: No dr home holds a secret
        id: secretless
        if: failure()
        env:
          DEEP_REASONER_TOKEN: ${{ secrets.DEEP_REASONER_TOKEN }}
        run: |
          for name in OPENAI_API_KEY CLAUDE_CODE_OAUTH_TOKEN DEEP_REASONER_TOKEN; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ] && grep -rqF -- "$value" "$RUNNER_TEMP/live"; then
              echo "::error::a dr home holds $name, so none is uploaded"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: failure() && steps.secretless.outcome == 'success'
        with:
          name: live-dr-homes
          path: ${{ runner.temp }}/live/*/home/
          retention-days: 7
