# The live tier: real runs on gpt-6-luna through dr-acp, started on demand.
name: live

on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: The model key is a repository secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::the OPENAI_API_KEY repository secret is not set"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Read access to deep_reasoner_beta (private)
        run: git config --global url."https://x-access-token:${{ secrets.DEEP_REASONER_TOKEN }}@github.com/DeanLight/".insteadOf "https://github.com/DeanLight/"
      - run: uv sync --locked
      - run: uv run pytest -m live -v -rA --basetemp="$RUNNER_TEMP/live"
      # On a failure, every test's dr home is kept: its runs (run log, model calls,
      # deep_reasoner's trace, each MCP server's log, all redacted) and the MCP test's
      # transcript. It is uploaded only once no file in it holds the model key.
      - name: No dr home holds the model key
        id: keyless
        if: failure()
        run: |
          if grep -rqF -- "$OPENAI_API_KEY" "$RUNNER_TEMP/live"; then
            echo "::error::a dr home holds the model key, so it is not uploaded"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure() && steps.keyless.outcome == 'success'
        with:
          name: live-dr-homes
          path: ${{ runner.temp }}/live/*/home/
          retention-days: 7
