[project]
name = "deep-reasoning"
version = "0.1.0"
description = "deep_reasoner as an ACP agent"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "genai-prices>=0.1.9,<0.2",
    "pydantic>=2.7",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_reasoning"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["docs"]
