[project]
name = "deep-reasoning"
version = "0.1.0"
description = "deep_reasoner as an ACP agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deep-reasoner @ git+https://github.com/DeanLight/deep_reasoner_beta@d7334ae6ea884617a377d9f1ce872530d898484c",
    "agent-client-protocol>=0.12.1,<0.13",
    "genai-prices>=0.1.9,<0.2",
    "pydantic>=2.7",
    "pyyaml",
    "structlog",
    "starlette>=0.40",
    "uvicorn>=0.30",
    # The key proxy forwards with it (D5 §4.7).
    "httpx>=0.28",
    # deep_reasoner imports IPython.display at module level but declares it only in its dev group.
    "ipython",
    "mcp>=1.28,<2",
]

[project.scripts]
dr-acp = "deep_reasoning.acp.cli:main"
dr-library = "deep_reasoning.library.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "jsonschema",
    "referencing",
    "ruff",
    "playwright==1.56.0",
    "deep-reasoning-app",
]

[tool.uv.workspace]
members = ["packages/dr-app"]

[tool.uv.sources]
deep-reasoning-app = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/deep_reasoning"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/", "as_built/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real model; run with -m live",
    "browser: drives the panel in Chromium (Playwright); run with -m browser",
    "desktop: builds and drives the desktop app (E12); run with -m desktop",
    "crossrepo: runs against the pinned forks' code; run with -m crossrepo",
]
addopts = "-m 'not live and not browser and not desktop and not crossrepo'"

[tool.ruff]
# docs: design notes; tests/mcp/fixtures: a stored shim, frozen as the Library holds it.
extend-exclude = ["docs", "tests/mcp/fixtures"]
src = [".", "src", "packages/dr-app/src"]
