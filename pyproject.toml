[project]
name = "deep-reasoning"
version = "0.1.0"
description = "A minimal chat for deep_reasoner, in one browser tab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deep-reasoner @ git+https://github.com/DeanLight/deep_reasoner_beta.git@0.3.0",
    "fastapi>=0.162.0",
    "structlog>=25.5.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
deep-reasoning = "deep_reasoning.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
# verbatim copies of deep_reasoner's example configs, used as test data
extend-exclude = ["tests/configs"]
