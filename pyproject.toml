[project]
name = "deep-reasoning"
version = "0.1.0"
description = "A minimal chat for deep_reasoner, in one browser tab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deep-reasoner @ git+https://github.com/DeanLight/deep_reasoner_beta.git@0.3.0",
    "fastapi>=0.162.0",
    "genai-prices>=0.1.13",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
deep-reasoning = "deep_reasoning.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
# verbatim copies of deep_reasoner's example configs, used as test data
extend-exclude = ["tests/configs"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: calls a real model and costs money; run only with pytest -m live"]
