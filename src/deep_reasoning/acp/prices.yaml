# Model prices in USD per million tokens, and context windows in tokens. A key is a model
# id or a glob over model ids; $DR_HOME/prices.yaml is laid over this file.
gpt-6-luna:
  input_per_mtok: 0.10
  output_per_mtok: 0.50
  context_window: 1050000
  source: >-
    OpenAI's standard tier as listed by OpenRouter and eesel.ai, read through a web search
    on 2026-10-02 (openai.com was unreachable from the build sandbox); check against
    https://openai.com/api/pricing/
  as_of: "2026-10-02"
