[project]
name = "deep-reasoning-app"
version = "0.1.0"
description = "dr-app: the desktop app's setup command, standard library only (D5)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
dr-app = "dr_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_app"]
