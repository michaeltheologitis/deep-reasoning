[project]
name = "deep-reasoning-web"
version = "0.1.0"
description = "deep-reasoning: Deep Reasoning in the browser, from one uvx command (TASK-48), standard library only"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
deep-reasoning = "dr_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_web"]
